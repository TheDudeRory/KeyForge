[package]
name = "keyforge"
version = "0.1.0"
description = "KeyForge - global hotkeys and macro automation"
authors = ["KeyForge"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "keyforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-global-shortcut = "2.3.2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-clipboard-manager = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

# Macro engine (src/macros/**): scripted-expression eval (rhai), OS input
# injection (enigo), async executor + cancellation (tokio/tokio-util),
# clipboard (arboard), desktop notifications (notify-rust), structured logs.
rhai = { version = "1.25", features = ["serde", "sync"] }
enigo = "0.6"
arboard = "3.6"
rfd = "0.17"
notify-rust = "4.18"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "process", "test-util"] }
tokio-util = "0.7"
tracing = "0.1"

# Process conditions + the "kill process" step (src/macros/sys.rs).
sysinfo = "0.33"

# Windows-native backends for the macro engine (window mgmt, audio device
# switching via IPolicyConfig, USB enumeration, pixel/shell/sound). Non-windows
# falls back to the module stubs.
[target."cfg(windows)".dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
windows-core = "0.62"

[target."cfg(not(windows))".dependencies]
# X11 screen/pointer queries for pixel_at + cursor_pos (src/macros/sys.rs).
# X11-only; Wayland/headless returns a clear Err. Pulls no Windows code.
# `randr` is REQUIRED: without it `x11rb::protocol::randr` does not exist and
# macros/window.rs monitors() falls back to one MonitorInfo per X screen root,
# so a multi-monitor Linux desktop reports as a single display.
x11rb = { version = "0.13", features = ["randr"] }

[profile.release]
opt-level = "s"   # optimize for size — it's a portable exe you ship around
lto = true
codegen-units = 1
strip = true
panic = "abort"
