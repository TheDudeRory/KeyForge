[package]
name = "keyforge"
version = "0.1.0"
edition = "2024"

[dependencies]
eframe = "0.35.0"
global-hotkey = "0.8.0"
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.24.1"
