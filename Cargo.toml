[package]
name = "keyforge"
version = "0.1.0"
edition = "2024"

[dependencies]
arboard = "3.6.1"
chrono = "0.4.45"
eframe = "0.35.0"
enigo = "0.6.1"
global-hotkey = "0.8.0"
notify-rust = "4.18.0"
regex = "1.13.0"
rfd = "0.17.2"
rhai = { version = "1.25.1", features = ["serde", "sync"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sysinfo = "0.39.6"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "time", "sync", "test-util", "process"] }
tokio-util = "0.7.18"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
tray-icon = "0.24.1"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_DeviceAndDriverInstallation"] }
windows-core = "0.62.2"
